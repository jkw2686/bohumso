name: security-release-audit
on:
  push:
    paths: ['scripts/security-release-audit.mjs', '.github/workflows/security-release-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Read-only schema and security audit
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/security-release-audit.mjs
