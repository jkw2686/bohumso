name: migrate

# main에 push되어 supabase/ 마이그레이션이 바뀌면 라이브 Supabase에 자동 적용한다.
# DATABASE_URL(Supabase 연결 문자열, 비밀)은 GitHub Secrets에 둔다. 로그에 값이 찍히지 않는다.
# 최초 1회는 MIGRATE_BASELINE 이전 파일을 '이미 적용됨'으로 기록만 하고 그 이후만 실제 적용한다.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'scripts/migrate-early-access.mjs'
      - '.github/workflows/migrate.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: migrate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check database connection configuration
        id: database
        env:
          # Repository secret이 정석이다. Variables 탭에 잘못 넣은 경우도 집어내려고 둘 다 본다.
          # 값 자체는 어느 쪽에서도 출력하지 않는다.
          FROM_SECRET: ${{ secrets.DATABASE_URL }}
          FROM_VAR: ${{ vars.DATABASE_URL }}
        run: |
          if [ -n "$FROM_SECRET" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "source=secret" >> "$GITHUB_OUTPUT"
            echo "DATABASE_URL found in repository secrets."
          elif [ -n "$FROM_VAR" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "source=var" >> "$GITHUB_OUTPUT"
            echo "::warning::DATABASE_URL was found in Variables, not Secrets. It works but is not masked in logs — move it to Settings → Secrets and variables → Actions → Repository secrets."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "source=none" >> "$GITHUB_OUTPUT"
            echo "::warning::DATABASE_URL is not configured for this workflow. Check Settings → Secrets and variables → Actions → Repository secrets (an Environment secret or an organization secret without repository access is not visible here). Until then apply reviewed SQL through the Supabase SQL Editor; see supabase/README.md."
          fi
      - name: Apply pending migrations
        if: steps.database.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || vars.DATABASE_URL }}
          # 운영에 이미 적용된 마지막 파일. 그 이전 파일은 실행하지 않고 기록만 하고,
          # 운영에서 078과 기존 대표 제한 SQL이 확인됨. 이전 파일은 채택만 하고 079부터 적용한다.
          # 앞으로 손으로 적용한 파일이 생기면 이 값을 그 파일로 올린다.
          MIGRATE_ADOPT_THROUGH: 078_expert_phone_connection.sql
        # supabase/NNN_*.sql 중 기록에 없는 것만 번호 순서로 적용하고
        # private.schema_migrations에 기록한다. 027 기준선 테이블이 없으면 적용하지 않는다.
        run: node scripts/migrate.mjs
