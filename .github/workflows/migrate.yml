name: migrate

# main에 push되어 supabase/ 마이그레이션이 바뀌면 라이브 Supabase에 자동 적용한다.
# DATABASE_URL(Supabase 연결 문자열, 비밀)은 GitHub Secrets에 둔다. 로그에 값이 찍히지 않는다.
# 최초 1회는 MIGRATE_BASELINE 이전 파일을 '이미 적용됨'으로 기록만 하고 그 이후만 실제 적용한다.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'scripts/migrate-early-access.mjs'
      - '.github/workflows/migrate.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: migrate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check database connection configuration
        id: database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DATABASE_URL is not configured. Apply reviewed SQL through the Supabase SQL Editor; see HANDOFF.md."
          fi
      - name: Apply pending migrations
        if: steps.database.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # Apply only the reviewed early-access migration set on the audited 027 baseline.
        # Optional legacy/test/beta migrations are never auto-applied by this job.
        run: node scripts/migrate-early-access.mjs
