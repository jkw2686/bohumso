[build]
command = "npm run build"
publish = "public"
functions = "netlify/functions"
[build.environment]
NODE_VERSION = "22"
[[redirects]]
from = "/api/config"
to = "/.netlify/functions/public-config"
status = 200
force = true
[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
X-Frame-Options = "DENY"
Permissions-Policy = "geolocation=(self), camera=(), microphone=(), usb=()"
# CSP는 우선 Report-Only로 배포한다(아무것도 차단하지 않고 위반만 콘솔에 보고).
# 스테이징에서 지도/결제/인증/가입 흐름을 돌려 위반 0을 확인한 뒤,
# 헤더명을 Content-Security-Policy 로 바꿔 강제 적용한다. (docs/deploy-runbook.md §2.1)
# script-src의 'unsafe-inline'은 현재 onclick 핸들러 12개 때문에 필요하다.
# 이를 addEventListener로 리팩터링하면 'unsafe-inline'을 제거해 강도를 높일 수 있다.
Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://js.tosspayments.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; img-src 'self' data: https://*.tile.openstreetmap.org https://*.tosspayments.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.tosspayments.com https://*.tosspayments.com; font-src 'self' data:; frame-src https://*.tosspayments.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
