[build]
command = "npm run build"
publish = "public"
functions = "netlify/functions"
[build.environment]
NODE_VERSION = "22"
[[redirects]]
from = "/api/config"
to = "/.netlify/functions/public-config"
status = 200
force = true
[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
X-Frame-Options = "DENY"
