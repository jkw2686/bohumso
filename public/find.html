<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>내 근처에서 도움받기 - 우리곁에 보험소</title><meta property="og:site_name" content="우리곁에 보험소"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/visual.css"><link rel="stylesheet" href="/account.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"><script defer src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script><link rel="stylesheet" href="/expert-onboarding.css"></head><body data-account-page="directory"><div class="nav"><a class="logo" href="/"><span class="local">우리곁에</span><span class="brand">보험소</span></a><a href="/find.html">설계사 찾기</a><a href="/account.html">내 계정</a></div><main class="container"><h1>내 근처에서 도움받기</h1><p id="accountNotice" role="status"></p><p id="accountMessage" role="alert"></p><div id="accountContent"><p>상황과 지역을 고르고 가까운 전문가를 직접 선택하세요. 지금 통화·바로 만나기도 전문가의 응답과 일정 확인이 필요합니다.</p><form id="findForm" class="card"><label>지금 도움을 받을 지역<select name="region"><option value="">서울·수도권 전체</option><option>서울</option><option>경기</option><option>인천</option></select></label><label>상담 목적<select name="purpose"><option value="">전체</option><option value="claim">보험금 청구 관련 문의</option><option value="management">기존 보험 관리·담당자 찾기</option><option value="coverage">보장 점검</option><option value="new">신규 가입 상담</option><option value="other">기타 문의</option></select></label><label>상담 가능 상태<select name="availability"><option value="">모든 상태</option><option value="now">지금 가능</option><option value="today">오늘 가능</option><option value="scheduled">예약 가능</option></select></label><button type="submit" class="btn">도움 가능한 전문가 찾기</button><label><input type="checkbox" name="location_consent"> 현재 위치를 거리 정렬에 사용합니다. 위치는 저장하지 않습니다.</label><button id="locatePlanners" type="button">내 위치로 가까운 순 보기</button></form><p id="directoryNotice" role="status"></p><p id="mapNotice" role="status">
