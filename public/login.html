<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>로그인 - 보험소</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/visual.css"><link rel="stylesheet" href="/account.css"></head><body data-account-page="login"><div class="nav"><a class="logo" href="/"><span class="local">우리동네</span><span class="brand">보험소</span></a><a href="/account.html">내 계정</a></div><main class="container"><h1>로그인</h1><p id="accountNotice" role="status">회원 서비스 연결 상태를 확인하고 있습니다.</p><div id="accountContent" hidden><div class="card"><div class="social-auth"><button id="kakaoLogin" type="button" disabled class="btn btn-kakao">카카오로 로그인</button><button id="googleLogin" type="button" disabled class="btn btn-social">Google로 로그인</button><button id="naverLogin" type="button" disabled class="btn btn-social">네이버 로그인 준비 중</button><button id="appleLogin" type="button" disabled class="btn btn-social">Apple 로그인 준비 중</button><button id="facebookLogin" type="button" disabled class="btn btn-social">Facebook 로그인 준비 중</button></div><p>연결 준비 중인 로그인은 사용할 수 없습니다. 이메일로 먼저 가입할 수 있습니다.</p><div class="auth-divider"><span>또는 이메일로</span></div><form id="loginForm"><label>이메일<input type="email" name="email" autocomplete="username" required></label><label>비밀번호<input type="password" name="password" autocomplete="current-password" required></label><button class="btn">로그인</button><button type="button" id="resetPassword" class="btn secondary">비밀번호 재설정 메일 받기</button><a href="/signup.html">회원가입</a></form></div></div><div id="accountMessage" role="alert"></div></main><script type="module" src="/assets/account.js"></script></body></html>
