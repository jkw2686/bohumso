<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>전문가·설계사 전용 - 보험소</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/visual.css"><link rel="stylesheet" href="/account.css"></head><body data-account-page="partner"><div class="nav"><a class="logo" href="/"><span class="local">우리동네</span><span class="brand">보험소</span></a><a href="/account.html">내 계정</a></div><main class="container"><h1>전문가·설계사 전용</h1><p id="accountNotice" role="status">회원 서비스 연결 상태를 확인하고 있습니다.</p><div id="accountContent" hidden><section class="card"><p id="partnerState"></p><p>고객 계정과 별도로 자격·소속을 검토합니다. 신청만으로 고객 정보를 볼 수 없습니다.</p><a href="/account.html">내 계정</a></section><form id="partnerForm" class="card" hidden><label>이름<input name="full_name" minlength="2" maxlength="60" autocomplete="name" required></label><label>직군<select name="profession"><option value="planner">보험설계사</option><option value="adjuster">손해사정사</option><option value="lawyer">변호사</option><option value="corporate">기업보험 컨설턴트</option><option value="tax">세무사</option><option value="office">보험대리점·거점 운영자</option></select></label><label>소속 회사·사무소<input name="organization" minlength="2" maxlength="120" required></label><label>활동 지역<input name="region" minlength="2" maxlength="120" required></label><label>자격·등록 확인용 번호 또는 확인 경로<input name="credential_reference" minlength="2" maxlength="120" required></label><p id="credentialHint"></p><label>발급기관·자격 확인 기관<input name="credential_issuer" minlength="2" maxlength="120" required></label><label>심사 연락용 전화번호<input name="business_contact" type="tel" autocomplete="tel" minlength="8" maxlength="30" pattern="[+0-9() &#45;]{8,30}" required></label><label>관련 업무 경력 (년)<input name="career_years" type="number" min="0" max="80" step="1" value="0" required></label><fieldset><legend>가능한 상담 방식 (1개 이상)</legend><label><input type="checkbox" name="consultation_modes" value="remote"> 전화·온라인</label><label><input type="checkbox" name="consultation_modes" value="visit"> 방문 상담</label><label><input type="checkbox" name="consultation_modes" value="office"> 사무소 상담</label></fieldset><p>심사 연락처·자격 정보는 신청자와 관리자만 조회합니다. 주민등록번호·신분증·진료서류를 입력하거나 업로드하지 마세요.</p><label><input type="checkbox" name="verification_consent" required> [필수] 제출한 이름·직군·소속·지역·자격 정보의 검토에 동의합니다. 목적·보유 기간은 <a href="/privacy.html" target="_blank" rel="noopener">개인정보 안내</a>를 확인해 주세요.</label><button class="btn" type="submit">전문가 심사 신청</button></form><p><a href="/partner-work.html">전문가 업무·일정</a></p><div id="partnerDetails" class="card" hidden></div></div><div id="accountMessage" role="alert"></div></main><script type="module" src="/assets/account.js"></script></body></html>
