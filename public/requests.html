<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>내 상담·방문예약 - 보험소</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/visual.css"><link rel="stylesheet" href="/account.css"></head><body data-account-page="requests" data-workspace="customer"><div class="nav"><a class="logo" href="/"><span class="local">우리동네</span><span class="brand">보험소</span></a><a href="/account.html">내 계정</a></div><main class="container"><h1>내 상담·방문예약</h1><p id="accountNotice" role="status">회원 서비스 연결 상태를 확인하고 있습니다.</p><div id="accountMessage" role="alert" aria-live="polite"></div><div id="accountContent" hidden><form id="requestForm" class="card" hidden><h2>상담·방문 희망 일정</h2><p>목록에서 직접 선택한 설계사와 일정을 확인하고 확정하세요. 현재 단계는 희망 일정 접수이며 예약 확정이 아닙니다.</p><label>이용 방법<select name="kind"><option value="consult">상담</option><option value="visit">대리점·거점 방문</option></select></label><label>전문 분야<select name="profession"><option value="planner">보험설계사</option><option value="adjuster">손해사정사</option><option value="lawyer">변호사</option><option value="corporate">기업보험 컨설턴트</option><option value="tax">세무사</option><option value="office">보험대리점·거점</option></select></label><label>희망 지역<input name="region" placeholder="예: 서울 마포구" minlength="2" maxlength="120" required></label><label>희망 날짜<input type="date" name="date" required></label><label>희망 시간<select name="time"><option>09:00</option><option>09:30</option><option>10:00</option><option>10:30</option><option>11:00</option><option>11:30</option><option>12:00</option><option>12:30</option><option>13:00</option><option>13:30</option><option>14:00</option><option>14:30</option><option>15:00</option><option>15:30</option><option>16:00</option><option>16:30</option><option>17:00</option><option>17:30</option></select></label><p>상담은 30분 단위로 요청합니다. 이름·연락처는 선택한 설계사와 일정 확정 동의 단계에서 입력합니다.</p><button class="btn">희망 일정 신청</button></form><section class="card"><h2>내 상담·방문예약</h2><p>최근 200건 · 모든 일정은 한국 시간 기준입니다.</p><button id="refreshRequests" type="button">새로고침</button></section><section id="workflowSummary" class="card"></section><form id="workflowFilters" class="card"><label>상태<select name="state"><option value="">전체</option><option value="requested">요청</option><option value="coordinating">일정 조율</option><option value="confirmed">양측 확정</option><option value="scheduled">미팅 예정</option><option value="awaiting_completion">완료 확인 대기</option><option value="completed">완료</option><option value="cancelled">취소</option><option value="no_show">노쇼 신고</option><option value="dispute">분쟁</option><option value="unmatched">요청 종료</option></select></label><label>희망 지역<input name="region"></label><label>설계사 이름<input name="planner"></label><label>일정 날짜 (KST)<input type="date" name="date"></label><label>상담 목적<select name="purpose"><option value="">전체</option><option value="claim">보험금 청구</option><option value="management">기존 보험 관리</option><option value="coverage">보장 점검</option><option value="new">신규 가입</option><option value="other">기타</option></select></label><button type="submit">필터 적용</button></form><div id="requestList"></div></div></main><details class="container"><summary>이전 방식 예약 이력 (조회 전용)</summary><div id="legacyRequests"></div></details><script type="module" src="/assets/account.js"></script></body></html>
