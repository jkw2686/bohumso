<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover: 노치·홈바 safe-area 사용을 위해 필요 -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>내 주변 보험소 - 우리곁에 보험소</title>
<meta name="description" content="현재 위치 기준으로 가까운 우리곁에 보험소(전문가·거점)를 지도에서 찾아보세요.">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/map.css">
</head>
<body class="map-page">

<header class="map-nav">
  <a class="logo" href="/index.html"><span class="local">우리곁에</span><span class="brand">보험소</span></a>
</header>

<!-- 위치 거부 시: 지역 직접 선택 -->
<div class="region-picker" id="regionPicker" hidden>
  <p class="region-title">위치를 사용할 수 없어요. 지역을 선택하세요.</p>
  <div class="region-row">
    <label class="sr-only" for="regionCity">시/도</label>
    <select id="regionCity" aria-label="시/도 선택">
      <option value="">시/도</option>
      <option value="서울">서울</option>
      <option value="경기">경기</option>
      <option value="인천">인천</option>
    </select>
    <label class="sr-only" for="regionGu">구/군</label>
    <select id="regionGu" aria-label="구/군 선택">
      <option value="">구/군</option>
    </select>
    <button class="btn" id="regionApply" type="button">이 지역 보기</button>
  </div>
</div>

<!-- 지도: 화면 세로의 큰 비중(65dvh) -->
<div id="map" role="application" aria-label="내 주변 보험소 지도"></div>
<p class="map-credit">지도 © OpenStreetMap 기여자</p>

<button class="locate-fab" id="locateFab" type="button" aria-label="현재 위치로 이동">
  <svg viewBox="0 0 24 24" aria-hidden="true" width="22" height="22"><path fill="currentColor" d="M12 8a4 4 0 100 8 4 4 0 000-8zm0-6a1 1 0 011 1v1.06A8.01 8.01 0 0119.94 11H21a1 1 0 110 2h-1.06A8.01 8.01 0 0113 19.94V21a1 1 0 11-2 0v-1.06A8.01 8.01 0 014.06 13H3a1 1 0 110-2h1.06A8.01 8.01 0 0111 4.06V3a1 1 0 011-1zm0 4a6 6 0 100 12 6 6 0 000-12z"/></svg>
</button>

<!-- 하단 전문가 목록 바텀시트 (드래그: 위로=목록↑, 아래로=지도↑) -->
<section class="list-sheet" id="listSheet" aria-label="주변 보험소 목록">
  <button class="sheet-grip" id="listGrip" type="button" aria-label="목록 펼치기/접기"></button>
  <div class="list-head">
    <strong id="listCount">주변 보험소</strong>
    <div class="sort-tabs" role="tablist" aria-label="정렬 기준">
      <button role="tab" data-sort="distance" aria-selected="true">거리순</button>
      <button role="tab" data-sort="rating" aria-selected="false">평점순</button>
      <button role="tab" data-sort="specialty" aria-selected="false">분야순</button>
    </div>
  </div>
  <div class="list-body" id="listBody"></div>
</section>

<!-- 마커/카드 탭 → 하단에서 올라오는 작은 카드 (요약→상세, 전체화면 아님) -->
<div class="card-sheet" id="cardSheet" hidden aria-live="polite">
  <button class="sheet-grip" id="cardGrip" type="button" aria-label="카드 크기 조절"></button>
  <div class="card-sheet-body" id="cardBody"></div>
</div>
<div class="card-scrim" id="cardScrim" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="/map.js"></script>
</body>
</html>
