<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>회원가입 - 보험소</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/visual.css"><link rel="stylesheet" href="/account.css"></head><body data-account-page="signup"><div class="nav"><a class="logo" href="/"><span class="local">우리동네</span><span class="brand">보험소</span></a><a href="/account.html">내 계정</a></div><main class="container"><h1>회원가입</h1><p id="accountNotice" role="status">회원 서비스 연결 상태를 확인하고 있습니다.</p><div id="accountContent" hidden><div class="card"><p>고객과 전문가 모두 이메일로 계정을 만듭니다. 전문가는 로그인 후 자격 심사를 별도로 신청합니다.</p><form id="signupForm"><label>이메일<input name="email" type="email" autocomplete="email" required maxlength="254"></label><label>비밀번호<input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><p>비밀번호는 12자 이상으로 설정하세요.</p><label><input type="checkbox" name="signup_privacy" required> [필수] 계정 생성에 필요한 이메일 처리 내용을 <a href="/privacy.html" target="_blank" rel="noopener">개인정보 안내</a>에서 확인하고 동의합니다.</label><button class="btn" type="submit">인증 메일 받고 가입 시작</button></form><p>이메일 확인 후 로그인하여 약관 동의를 마치면 가입이 완료됩니다.</p><a href="/login.html">이미 계정이 있나요? 로그인</a></div></div><div id="accountMessage" role="alert"></div></main><script type="module" src="/assets/account.js"></script></body></html>
